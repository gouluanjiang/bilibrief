name: Collect Bilibili updates

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. These correspond approximately to
    # 01:20, 07:20, 13:20, 19:20 in China Standard Time (UTC+8).
    - cron: '20 17 * * *'
    - cron: '20 23 * * *'
    - cron: '20 5 * * *'
    - cron: '20 11 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bilibrief-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Bilibili feed
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
          RETENTION_HOURS: '168'
          LATEST_HOURS: '30'
          RECENT_HOURS: '72'
        run: python src/collector.py

      - name: Save rolling archive back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json public/latest.json public/recent.json public/health.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update BiliBrief data [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
